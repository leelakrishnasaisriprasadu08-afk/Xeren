# Xeren-1B GPU Training Configuration
# Architecture: dim=2048, 19 layers, 16 heads, 8 KV heads → ~1.016B parameters
# Vocab: 32768 (~33k BPE tokens)
# Target GPU: A100 40GB / RTX 3090 24GB / H100
# RTX A1000 (6GB): use inference only after training on a cloud GPU

model:
  preset: mini_1b
  dim: 2048
  n_layers: 19
  n_heads: 16
  n_kv_heads: 8
  max_seq_len: 2048
  norm_eps: 0.00001
  tie_word_embeddings: false

training:
  batch_size: 2                    # per-GPU batch (keep small for VRAM)
  gradient_accumulation_steps: 32  # effective batch size = 64
  learning_rate: 0.0001            # Chinchilla-optimal for 1B
  min_lr_ratio: 0.1
  weight_decay: 0.1
  num_warmup_steps: 2000
  num_epochs: 3
  max_steps: null
  device: cuda
  use_amp: true                    # fp16 mixed precision — essential for 1B
  logging_steps: 20
  eval_steps: 500
  save_steps: 1000

data:
  max_seq_len: 2048
  max_samples_per_hf: 50000        # larger dataset for 1B
  checkpoint_dir: training/checkpoints/mini_1b
  tokenizer_dir: training/checkpoints/tokenizer
