# =============================================================================
# Xeren-Mini-50: Stage 1 GPU Training Configuration
# Model: ~70M parameters | Vocab: 16K | GPU: RTX A1000 (8GB)
# Focus: Language foundation, basic planning, plugin grounding
# Estimated Training Time: 30-50 minutes
# =============================================================================

model:
  preset: stage1
  vocab_size: 16384
  dim: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  hidden_dim: 2048
  max_seq_len: 1024
  norm_eps: 0.000001
  rope_theta: 10000.0
  dropout: 0.1
  tie_word_embeddings: false
  enable_plugin_head: false
  enable_confidence_head: false
  enable_threat_head: false

training:
  batch_size: 8
  gradient_accumulation_steps: 4        # Effective batch = 32
  learning_rate: 0.0003
  min_lr_ratio: 0.1
  weight_decay: 0.1
  num_warmup_steps: 300
  num_epochs: 3
  max_steps: null
  device: cuda
  use_amp: true                         # FP16 mixed precision
  gradient_checkpointing: false         # Not needed for Stage 1 (fits in 8GB)
  logging_steps: 20
  eval_steps: 100
  save_steps: 300
  max_grad_norm: 1.0

data:
  max_seq_len: 1024
  tokenizer_dir: training/checkpoints/tokenizer
  train_file: training/data/processed/stage1_train_texts.json
  val_file: training/data/processed/stage1_val_texts.json
  checkpoint_dir: training/checkpoints/stage1

# Stage 1 → Stage 2 handoff
output:
  save_final_checkpoint: training/checkpoints/stage1/checkpoint_final.pt
  export_config: training/checkpoints/stage1/xeren_config.json
