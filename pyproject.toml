[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xeren"
version = "0.1.0"
description = "Xeren AI framework"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "chromadb>=0.4.0",
    "qdrant-client>=1.9.0",
    "sqlmodel>=0.0.16",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "torch>=2.0.0",
    "datasets>=2.0.0",
    "tokenizers>=0.14.0",
    "pyyaml>=6.0",
    "onnxruntime<1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "playwright>=1.40.0",
]
browser = [
    "playwright>=1.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
include = ["src", "tests", "training"]
exclude = ["**/__pyrefly_virtual__/**", "**/__pycache__/**", ".venv"]
extraPaths = [
    ".",
    "src",
    "training",
    ".venv/Lib/site-packages",
    "C:/Users/Vignan Lara/AppData/Roaming/Python/Python310/site-packages",
]

[tool.pyrefly]
python-interpreter-path = ".venv/Scripts/python.exe"
search-path = [
    ".",
    "src",
    "training",
    ".venv/Lib/site-packages",
    "C:/Users/Vignan Lara/AppData/Roaming/Python/Python310/site-packages",
]
site-package-path = [
    ".venv/Lib/site-packages",
    "C:/Users/Vignan Lara/AppData/Roaming/Python/Python310/site-packages",
]
project_excludes = [
    ".venv",
    "**/__pyrefly_virtual__/**",
    "**/__pycache__/**",
]
exclude = [
    ".venv/**",
    "**/__pyrefly_virtual__/**",
    "**/__pycache__/**",
]


